name: demo-app

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       demo
      POSTGRES_USER:     demo
      POSTGRES_PASSWORD: demo
      LOGGING_LEVEL:    DEBUG
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Curity Identity Server ──────────────────────────────────────────────────
  curity:
    image: curity.azurecr.io/curity/idsvr:latest
    environment:
      PASSWORD:       Password1
      ADMIN:          "true"
      CURITY_DB_USER: demo
      CURITY_DB_PASS: demo
    volumes:
      - ./curity/idsvr-config-backup.xml:/opt/idsvr/etc/init/config.xml:ro
      - ./curity/license.json:/opt/idsvr/etc/init/license/license.json:ro
    ports:
      - "6749:6749"   # admin UI  (HTTPS)
      - "8443:8443"   # runtime   (HTTPS)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8443"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  # ── Spring Boot API ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://db:5432/demo
      SPRING_DATASOURCE_USERNAME: demo
      SPRING_DATASOURCE_PASSWORD: demo
      # Reference the Curity container by service name inside the Docker network.
      # The API trusts the self-signed cert via the insecure JwtDecoder (dev only).
      CURITY_JWKS_URI:      https://curity:8443/oauth/v2/oauth-anonymous/jwks
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      curity:
        condition: service_healthy

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    environment:
      # Browser-facing OIDC config — authority must be reachable from the user's browser
      AUTHORITY:           https://localhost:8443/oauth/v2/oauth-anonymous
      CLIENT_ID:           demo-frontend
      CLIENT_SECRET:       demo-secret
      # Upstream hostnames used by nginx (internal Docker network)
      CURITY_SCHEME:       https
      CURITY_HOST:         curity
      CURITY_PORT:         "8443"
      API_HOST:            api
      API_PORT:            "8080"
      # Base64(api-gateway-client:demo-secret) used for phantom token introspection
      GATEWAY_CREDENTIAL:  YXBpLWdhdGV3YXktY2xpZW50OmRlbW8tc2VjcmV0
    ports:
      - "3000:80"
    depends_on:
      - api
      - curity

volumes:
  postgres_data:
